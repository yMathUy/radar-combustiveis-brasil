name: Update Fuel Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 1"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuel-dashboard
  cancel-in-progress: false

jobs:
  update-data:
    name: Update dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Generate dashboard JSON files
        run: |
          python src/export_dashboard_data.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("docs/data/metadata.json"),
              Path("docs/data/latest_national_prices.json"),
              Path("docs/data/latest_state_gasoline_prices.json"),
              Path("docs/data/weekly_national_trends.json"),
          ]

          for file_path in files:
              if not file_path.exists():
                  raise FileNotFoundError(
                      f"File was not generated: {file_path}"
                  )

              with file_path.open(
                  "r",
                  encoding="utf-8"
              ) as file:
                  json.load(file)

              print(f"Validated: {file_path}")
          PY

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "No data changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add docs/data
            git commit -m "chore: update dashboard data"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publish dashboard
    needs: update-data
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4