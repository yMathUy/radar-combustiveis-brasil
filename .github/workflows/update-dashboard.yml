name: Update Fuel Dashboard

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/update-dashboard.yml"

  schedule:
    - cron: "0 10 * * 1"
      timezone: "America/Sao_Paulo"

concurrency:
  group: fuel-dashboard
  cancel-in-progress: false

jobs:
  update-data:
    name: Update dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests

      - name: Download ANP data
        run: |
          python src/download.py

      - name: Clean ANP data
        run: |
          python src/clean_data.py

      - name: Generate aggregated CSV files
        run: |
          python src/aggregate_data.py

      - name: Generate dashboard JSON files
        run: |
          python src/export_dashboard_data.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          csv_files = [
              Path("data/aggregated/weekly_national_prices.csv"),
              Path("data/aggregated/weekly_state_prices.csv"),
              Path("data/aggregated/weekly_municipality_prices.csv"),
          ]

          json_files = [
              Path("docs/data/metadata.json"),
              Path("docs/data/latest_national_prices.json"),
              Path("docs/data/latest_state_gasoline_prices.json"),
              Path("docs/data/weekly_national_trends.json"),
          ]

          for file_path in csv_files:
              if not file_path.is_file():
                  raise FileNotFoundError(
                      f"CSV file was not generated: {file_path}"
                  )

              if file_path.stat().st_size == 0:
                  raise ValueError(
                      f"CSV file is empty: {file_path}"
                  )

              print(f"Validated CSV: {file_path}")

          for file_path in json_files:
              if not file_path.is_file():
                  raise FileNotFoundError(
                      f"JSON file was not generated: {file_path}"
                  )

              with file_path.open(
                  "r",
                  encoding="utf-8"
              ) as file:
                  content = json.load(file)

              if content is None:
                  raise ValueError(
                      f"JSON file has no content: {file_path}"
                  )

              print(f"Validated JSON: {file_path}")

          print("All dashboard files were validated.")
          PY

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data/aggregated docs/data)" ]; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aggregated docs/data
          git commit -m "chore(data): update ANP dashboard data"

          git pull --rebase origin main
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website for publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publish dashboard
    needs: update-data
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4